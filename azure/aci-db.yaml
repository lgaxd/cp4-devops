location: ${LOCATION}
name: ${DB_CONTAINER}
properties:
  restartPolicy: Always
  osType: Linux

  imageRegistryCredentials:
    - server: ${ACR_SERVER}
      username: ${ACR_USERNAME}
      password: ${ACR_PASSWORD}

  containers:
    - name: spacecrop-db
      properties:
        image: ${ACR_SERVER}/spacecrop-db:v1

        ports:
          - port: 1521

        resources:
          requests:
            cpu: 2
            memoryInGB: 4

        environmentVariables:
          - name: ORACLE_PASSWORD
            secureValue: ${ORACLE_PASSWORD}

          - name: APP_USER
            value: ${DATABASE_USERNAME}

          - name: APP_USER_PASSWORD
            secureValue: ${DATABASE_PASSWORD}

        volumeMounts:
          - name: backup-volume
            mountPath: /backup

  volumes:
    - name: backup-volume
      azureFile:
        shareName: ${FILE_SHARE}
        storageAccountName: ${STORAGE_ACCOUNT}
        storageAccountKey: ${STORAGE_KEY}

  ipAddress:
    type: Public
    ports:
      - protocol: tcp
        port: 1521