location: ${LOCATION}
name: ${APP_CONTAINER}
properties:
  restartPolicy: Always
  osType: Linux

  imageRegistryCredentials:
    - server: ${ACR_SERVER}
      username: ${ACR_USERNAME}
      password: ${ACR_PASSWORD}

  containers:
    - name: spacecrop-api
      properties:
        image: ${ACR_SERVER}/spacecrop-api:v1

        ports:
          - port: 8080

        resources:
          requests:
            cpu: 1
            memoryInGB: 2

        environmentVariables:
          - name: DATABASE_URL
            value: jdbc:oracle:thin:@//${DB_IP}:1521/FREEPDB1

          - name: DATABASE_USERNAME
            value: ${DATABASE_USERNAME}

          - name: DATABASE_PASSWORD
            secureValue: ${DATABASE_PASSWORD}

          - name: JWT_SECRET
            secureValue: ${JWT_SECRET}

          - name: JWT_EXPIRATION
            value: "86400000"

          - name: CORS_ALLOWED_ORIGINS
            value: "*"

  ipAddress:
    type: Public
    dnsNameLabel: ${APP_DNS_LABEL}
    ports:
      - protocol: tcp
        port: 8080